name: Fortune Engine

on:
  push:
    branches: [main]
    paths:
      - "src/fortune.ts"
      - "src/crypto.ts"
      - "src/types.ts"
      - "test/fortune.test.ts"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/fortune-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Run fortune engine tests
        run: npm test
